name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AgentView.slnx

      - name: Build
        run: dotnet build AgentView.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AgentView.slnx --no-build --configuration Release
